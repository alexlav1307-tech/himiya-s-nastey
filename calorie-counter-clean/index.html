<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#9B7664"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Калории"><title>Счётчик калорий</title><style>:root{--bg:#f7f1ed;--card:#fffaf7;--accent:#9B7664;--line:#dcc8be;--text:#4b372f;--muted:#8a7368}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);padding:14px}.wrap{max-width:820px;margin:auto}h1{text-align:center}.sub,.mini,label{color:var(--muted);font-size:13px}.sub{text-align:center;margin-bottom:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f1e2da;border-radius:14px;padding:12px;text-align:center}.num{font-size:28px;font-weight:700}input,button{width:100%;font:inherit;border-radius:12px;border:1px solid var(--line);padding:12px;background:white;color:var(--text)}button{background:var(--accent);color:#fff;border:0;font-weight:700}.secondary{background:#eadbd4;color:var(--text)}.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}.title{font-size:18px;font-weight:800;margin-bottom:10px}.row{display:grid;grid-template-columns:1.35fr .8fr .7fr .7fr 40px;gap:7px;align-items:end;margin:8px 0}.calc{height:44px;border:1px solid var(--line);border-radius:12px;background:#f1e2da;display:flex;align-items:center;justify-content:center;font-weight:800}.del{height:44px;padding:0;background:#f0d8d3;color:#7b3d35}.fav{display:grid;grid-template-columns:1.3fr .7fr auto;gap:8px;align-items:center;border-top:1px solid #eee0d9;padding:10px 0}.fav button{width:auto;padding:9px 12px}.bar{height:11px;border-radius:20px;background:#eadfd9;overflow:hidden;margin-top:8px}.bar div{height:100%;background:var(--accent);width:0%}@media(max-width:620px){.row{grid-template-columns:1fr 1fr}.row .product{grid-column:1/3}.del{grid-column:2/3}.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>Счётчик калорий</h1><div class="sub">Простой дневной счётчик + твои постоянные продукты</div><div class="card"><div class="grid"><div class="stat"><div class="mini">Съедено сегодня</div><div class="num" id="total">0</div><div class="mini">ккал</div></div><div class="stat"><div class="mini">Осталось</div><div class="num" id="remaining">1250</div><div class="mini">ккал</div></div></div><div style="margin-top:12px"><label>Моя цель на день, ккал</label><input id="target" type="number" value="1250"><div class="bar"><div id="bar"></div></div></div></div><div class="card"><div class="title">Что я съела сегодня</div><div class="mini" style="margin-bottom:8px">Введи название, ккал на 100 г и сколько граммов съела. Калории порции посчитаются сами.</div><div id="entries"></div><button id="add">+ Добавить продукт</button><div class="grid" style="margin-top:10px"><button class="secondary" id="saveDay">Сохранить день</button><button class="ghost" id="reset">Сбросить день</button></div></div><div class="card"><div class="title">Мои постоянные продукты</div><div id="favorites"></div></div><div class="card"><div class="title">Добавить свой продукт</div><div class="grid"><div><label>Название</label><input id="nname"></div><div><label>Ккал / 100 г</label><input id="nkcal" type="number"></div><div><label>Порция, г/мл</label><input id="nportion" type="number"></div><div style="display:flex;align-items:end"><button id="addFav">Добавить</button></div></div></div></div><script>const defaults=[['Яйца',160,140],['ПП Наполеон',144,150],['Творожный сыр Hochland',244,13],['Авокадо',160,80],['Банан',90,140],['Ломтики индейки',100,40],['Хлеб бородинский бездрожжевой',200,40],['Латте «Пятёрочка»',38.67,250],['Йогурт греческий с грушей',88,130],['Гречка варёная',110,120],['Куриная грудка из аэрогриля',165,120]].map(x=>({name:x[0],kcal:x[1],portion:x[2]}));let s=JSON.parse(localStorage.getItem('cc_clean_state')||'null')||{target:1250,entries:[],favorites:defaults};const $=q=>document.querySelector(q),fmt=n=>(Math.round(n*10)/10).toString().replace('.',',');function save(){localStorage.setItem('cc_clean_state',JSON.stringify(s))}function itemCalories(e){return(+e.kcal||0)*(+e.grams||0)/100}function total(){return s.entries.reduce((a,e)=>a+itemCalories(e),0)}function updateStats(){const t=total();$('#total').textContent=fmt(t);$('#remaining').textContent=fmt(Math.max(0,s.target-t));$('#bar').style.width=Math.min(100,t/Math.max(1,s.target)*100)+'%';$('#target').value=s.target}function updateRowCalc(i){const el=document.querySelector(`[data-calc="${i}"]`);if(el)el.textContent=fmt(itemCalories(s.entries[i]))}function renderEntries(){const box=$('#entries');box.innerHTML='';if(!s.entries.length){box.innerHTML='<div class="mini" style="padding:8px 0 12px">Пока ничего не добавлено.</div>';return}s.entries.forEach((e,i)=>{const row=document.createElement('div');row.className='row';row.innerHTML=`<div class="product"><label>Продукт</label><input data-i="${i}" data-k="name" value="${e.name||''}" placeholder="Например, гречка"></div><div><label>Ккал / 100 г</label><input type="number" step="0.1" data-i="${i}" data-k="kcal" value="${e.kcal||''}"></div><div><label>Съела, г</label><input type="number" step="1" data-i="${i}" data-k="grams" value="${e.grams||''}"></div><div><label>Съедено, ккал</label><div class="calc" data-calc="${i}">${fmt(itemCalories(e))}</div></div><button class="del" data-del="${i}">×</button>`;box.appendChild(row)});box.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',ev=>{const i=+ev.target.dataset.i,k=ev.target.dataset.k;s.entries[i][k]=k==='name'?ev.target.value:+ev.target.value;save();updateRowCalc(i);updateStats()}));box.querySelectorAll('[data-del]').forEach(btn=>btn.onclick=()=>{s.entries.splice(+btn.dataset.del,1);save();renderEntries();updateStats()})}function renderFavs(){const box=$('#favorites');box.innerHTML='';s.favorites.forEach((f,i)=>{const d=document.createElement('div');d.className='fav';d.innerHTML=`<div><b>${f.name}</b><br><span class="mini">${fmt(f.kcal)} ккал / 100 г · ${fmt(f.portion)} г</span></div><div><b>${fmt(f.kcal*f.portion/100)}</b> ккал</div><div><button data-addfav="${i}">+</button> <button class="ghost" data-delfav="${i}">×</button></div>`;box.appendChild(d)});box.querySelectorAll('[data-addfav]').forEach(btn=>btn.onclick=()=>{const f=s.favorites[+btn.dataset.addfav];s.entries.push({name:f.name,kcal:f.kcal,grams:f.portion});save();renderEntries();updateStats()});box.querySelectorAll('[data-delfav]').forEach(btn=>btn.onclick=()=>{s.favorites.splice(+btn.dataset.delfav,1);save();renderFavs()})}$('#target').addEventListener('input',e=>{s.target=+e.target.value||0;save();updateStats()});$('#add').onclick=()=>{s.entries.push({name:'',kcal:'',grams:''});save();renderEntries()};$('#reset').onclick=()=>{if(confirm('Сбросить сегодняшний день? Постоянные продукты сохранятся.')){s.entries=[];save();renderEntries();updateStats()}};$('#saveDay').onclick=()=>{const h=JSON.parse(localStorage.getItem('cc_clean_history')||'{}'),d=new Date().toISOString().slice(0,10);h[d]={target:s.target,total:total(),entries:s.entries};localStorage.setItem('cc_clean_history',JSON.stringify(h));alert('День сохранён')};$('#addFav').onclick=()=>{const name=$('#nname').value.trim(),kcal=+$('#nkcal').value,portion=+$('#nportion').value;if(!name||!kcal||!portion)return alert('Заполни все три поля');s.favorites.push({name,kcal,portion});$('#nname').value='';$('#nkcal').value='';$('#nportion').value='';save();renderFavs()};renderEntries();renderFavs();updateStats();</script></body></html>
