<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AS Parfums · Заявки</title>
<style>
body{margin:0;background:#f3ece5;color:#241c19;font-family:Arial,sans-serif}.wrap{width:min(1050px,calc(100% - 24px));margin:auto;padding:28px 0 56px}.top{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:20px}h1{font:400 clamp(36px,6vw,54px) Georgia,serif;margin:0}.sub{color:#796e67;margin-top:6px}.count{background:#fffaf5;border:1px solid #dbcfc5;border-radius:999px;padding:10px 14px}.board{display:grid;gap:12px}.item{background:#fffaf5;border:1px solid #dbcfc5;border-radius:20px;padding:18px;display:grid;grid-template-columns:1.4fr .9fr .9fr;gap:15px}.name{font-weight:700;font-size:18px}.link{color:#6a2738;text-decoration:none;display:inline-block;margin-top:10px;word-break:break-word}.pill{display:inline-block;background:#eee3da;border-radius:999px;padding:5px 9px;font-size:12px;margin-top:10px}.muted{color:#7d726b;font-size:13px;line-height:1.45}select,input{width:100%;border:1px solid #dbcfc5;background:#fffdfa;border-radius:11px;padding:10px;font:inherit;color:#241c19}.save{width:100%;border:0;border-radius:11px;background:#6a2738;color:white;padding:10px 12px;font-weight:700;cursor:pointer;margin-top:8px}.empty{text-align:center;padding:50px;color:#7d726b}.section{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#776b64;margin-bottom:6px}.lock{max-width:460px;margin:100px auto;background:#fffaf5;border:1px solid #dbcfc5;border-radius:22px;padding:26px;text-align:center}.lock h2{font:400 32px Georgia,serif;margin:0 0 12px}.lock p{color:#7d726b;line-height:1.5}@media(max-width:760px){.item{grid-template-columns:1fr}}@media(max-width:560px){.top{flex-direction:column;align-items:start}}
</style></head><body>
<main class="wrap" id="app"><div class="top"><div><h1>Заявки AS Parfums</h1><div class="sub">Имя, ссылка и твои заметки</div></div><div class="count" id="count">Загрузка…</div></div><div id="board" class="board"></div></main>
<script>
const endpoint='https://hjjahzdjcvtwhlochpha.supabase.co/functions/v1/as-parfums-admin-api';
const key=new URLSearchParams(location.search).get('key')||'';
const labels={new:'Новая',checked:'Проверила',ordered:'Заказано',done:'Получено',cancelled:'Отменено'};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function field(id,val,ph){return '<input id="'+id+'" value="'+esc(val==null?'':val)+'" placeholder="'+ph+'">'}
async function load(){if(!key){document.getElementById('app').innerHTML='<div class="lock"><h2>Закрытая страница</h2><p>Откройте личную ссылку администратора AS Parfums.</p></div>';return}const r=await fetch(endpoint+'?api=list',{headers:{'x-admin-key':key}});if(!r.ok){document.getElementById('app').innerHTML='<div class="lock"><h2>Доступ закрыт</h2><p>Ключ администратора не подошёл.</p></div>';return}const a=await r.json();document.getElementById('count').textContent=a.length+' заявок';const b=document.getElementById('board');if(!a.length){b.innerHTML='<div class="empty">Пока заявок нет</div>';return}b.innerHTML=a.map(o=>{const opts=Object.keys(labels).map(v=>'<option value="'+v+'" '+(o.status===v?'selected':'')+'>'+labels[v]+'</option>').join('');const link=o.perfume_url?'<a class="link" href="'+esc(o.perfume_url)+'" target="_blank" rel="noopener">Открыть ссылку на аромат</a>':'<div class="muted">Ссылка не указана</div>';return '<article class="item"><div><div class="name">'+esc(o.customer_name)+'</div>'+link+'<div class="pill">'+new Date(o.created_at).toLocaleString('ru-RU')+'</div></div><div><div class="section">Цена поставщика</div>'+field('supplier-'+o.id,o.supplier_price,'₽')+'<div class="section" style="margin-top:9px">Цена клиенту</div>'+field('final-'+o.id,o.final_price,'₽')+'</div><div><div class="section">Статус</div><select id="status-'+o.id+'">'+opts+'</select><div class="section" style="margin-top:9px">Заметка</div>'+field('note-'+o.id,o.admin_note,'Для себя')+'<button class="save" data-id="'+esc(o.id)+'" data-path="'+esc(o._path)+'">Сохранить</button></div></article>'}).join('');document.querySelectorAll('.save').forEach(btn=>btn.addEventListener('click',()=>save(btn.dataset.id,btn.dataset.path,btn)))}
async function save(id,path,btn){btn.disabled=true;const old=btn.textContent;btn.textContent='Сохраняю…';const p={path,status:document.getElementById('status-'+id).value,supplier_price:document.getElementById('supplier-'+id).value||null,final_price:document.getElementById('final-'+id).value||null,admin_note:document.getElementById('note-'+id).value};const r=await fetch(endpoint+'?api=update',{method:'POST',headers:{'content-type':'application/json','x-admin-key':key},body:JSON.stringify(p)});btn.disabled=false;btn.textContent=r.ok?'Готово ✓':old;if(!r.ok)alert('Не удалось сохранить');setTimeout(()=>btn.textContent=old,1200)}
load();
</script></body></html>
