<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#211d1a">
  <title>Корзина заказа — AS Parfums</title>
  <meta name="description" content="Добавьте ссылки на ароматы и нужный объём в корзину заказа AS Parfums.">
  <style>
    :root{--dark:#211d1a;--paper:#fffdf9;--ink:#1d1916;--muted:#746b63;--line:#ddd2c7;--gold:#a48867;--ok:#42604b;--danger:#9c4545}
    *{box-sizing:border-box}html{font-size:16px}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#1d1916,#332a24);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:clamp(18px,5vw,58px)}
    .shell{width:min(680px,100%);margin:auto;background:var(--paper);border-radius:28px;overflow:hidden;box-shadow:0 32px 90px rgba(0,0,0,.28)}
    .top{background:#29231f;color:#f6eee6;padding:clamp(28px,6vw,48px);position:relative;overflow:hidden}.top:after{content:"";position:absolute;width:240px;height:240px;border:1px solid rgba(216,188,153,.18);border-radius:50%;right:-140px;top:-130px}.brand{font:clamp(1.35rem,4vw,1.8rem) Georgia,serif;letter-spacing:.13em}.eyebrow{margin-top:7px;color:#b9aa9d;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase}.top h1{font:clamp(2rem,7vw,3.4rem)/1 Georgia,serif;font-weight:400;margin:42px 0 12px}.top p{color:#cfc3b7;line-height:1.55;margin:0;max-width:500px}
    .form-card{padding:clamp(26px,6vw,48px)}.field{margin-bottom:22px}label{display:block;font-size:.9rem;margin-bottom:7px;color:#514943}input{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 14px;color:var(--ink);font:inherit;min-height:50px}input:focus{outline:3px solid rgba(164,136,103,.18);border-color:var(--gold)}
    .items-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 12px}.items-head h2{font:1.55rem Georgia,serif;font-weight:400;margin:0}.add{border:1px solid var(--line);background:transparent;border-radius:10px;padding:9px 12px;color:var(--ink);font:inherit;cursor:pointer}.add:hover{border-color:var(--gold)}
    .items{display:grid;gap:12px}.item{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}.item-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.item-number{font-weight:650}.remove{border:0;background:transparent;color:var(--danger);font:inherit;cursor:pointer;padding:4px}.item-fields{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:12px}.item .field{margin:0}.hint{font-size:.78rem;color:var(--muted);margin-top:6px}
    .submit{width:100%;min-height:54px;margin-top:24px;border:0;border-radius:12px;background:var(--dark);color:#fff;font:inherit;font-weight:650;cursor:pointer}.submit:hover{background:#3a302a}.submit:disabled{opacity:.6;cursor:wait}.privacy{font-size:.78rem;color:var(--muted);line-height:1.45;text-align:center;margin:12px 0 0}.message{display:none;margin-top:16px;padding:13px 14px;border-radius:11px;font-size:.9rem}.message.show{display:block}.message.error{background:#f4e4e4;color:var(--danger)}
    .success{display:none;text-align:center;padding:42px 20px}.success.show{display:block}.success-mark{width:64px;height:64px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;background:#e6efe8;color:var(--ok);font-size:1.8rem}.success h2{font:2.2rem Georgia,serif;font-weight:400;margin:0 0 12px}.success p{color:var(--muted);line-height:1.6}.again{border:1px solid var(--line);background:transparent;color:var(--ink);padding:11px 15px;border-radius:10px;font:inherit;cursor:pointer;margin-top:12px}.trap{position:absolute!important;left:-10000px!important;width:1px!important;height:1px!important;overflow:hidden!important}
    @media(max-width:600px){body{padding:0;background:var(--paper)}.shell{border-radius:0;box-shadow:none;min-height:100vh}.top{padding:26px 20px 30px}.top h1{margin-top:34px}.form-card{padding:26px 20px 38px}.item-fields{grid-template-columns:1fr}.items-head{align-items:flex-end}.add{font-size:.88rem}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand">AS PARFUMS</div>
      <div class="eyebrow">корзина заказа</div>
      <h1>Соберите свой заказ</h1>
      <p>Добавьте ссылки на ароматы и укажите нужный объём.</p>
    </header>
    <section class="form-card">
      <form id="orderForm">
        <div class="field"><label for="clientName">Ваше имя *</label><input id="clientName" autocomplete="name" required maxlength="80" placeholder="Например, Катя"></div>
        <div class="items-head"><h2>Позиции в корзине</h2><button class="add" id="addItem" type="button">+ Добавить ещё</button></div>
        <div class="items" id="items"></div>
        <div class="trap" aria-hidden="true"><label for="company">Компания</label><input id="company" tabindex="-1" autocomplete="off"></div>
        <button class="submit" type="submit">Отправить заказ</button>
        <p class="privacy">Нажимая кнопку, вы соглашаетесь на обработку данных из этой формы.</p>
        <div class="message" id="formMessage" role="status"></div>
      </form>
      <div class="success" id="success"><div class="success-mark">✓</div><h2>Заказ отправлен</h2><p id="successText">Все позиции добавлены в корзину.</p><button class="again" id="sendAgain" type="button">Собрать ещё один заказ</button></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script>
    (()=>{
      'use strict';
      const cloud=window.supabase.createClient('https://hjjahzdjcvtwhlochpha.supabase.co','sb_publishable_G_25Zs6vvHGwjXw42Ybl-g_1o642Ugd');
      const form=document.getElementById('orderForm'),items=document.getElementById('items'),message=document.getElementById('formMessage'),success=document.getElementById('success');
      const showMessage=text=>{message.textContent=text;message.className='message show error'};
      function itemTemplate(){return '<div class="item"><div class="item-top"><span class="item-number"></span><button class="remove" type="button">Удалить</button></div><div class="item-fields"><div class="field"><label>Ссылка на аромат *</label><input class="item-url" type="url" required maxlength="1200" placeholder="https://..."></div><div class="field"><label>Объём, мл *</label><input class="item-volume" type="number" inputmode="numeric" required min="1" max="1000" step="1" placeholder="50"></div></div></div>'}
      function refreshItems(){const rows=[...items.querySelectorAll('.item')];rows.forEach((row,index)=>{row.querySelector('.item-number').textContent='Позиция '+(index+1);row.querySelector('.remove').hidden=rows.length===1})}
      function addItem(){items.insertAdjacentHTML('beforeend',itemTemplate());refreshItems()}
      document.getElementById('addItem').addEventListener('click',()=>{addItem();items.lastElementChild.querySelector('.item-url').focus()});
      items.addEventListener('click',event=>{if(!event.target.classList.contains('remove'))return;event.target.closest('.item').remove();refreshItems()});
      form.addEventListener('submit',async event=>{
        event.preventDefault();
        if(document.getElementById('company').value)return;
        const clientName=document.getElementById('clientName').value.trim();
        const positions=[...items.querySelectorAll('.item')].map(row=>({url:row.querySelector('.item-url').value.trim(),volume:row.querySelector('.item-volume').value.trim()}));
        if(!clientName||positions.some(item=>!item.url||!item.volume)){showMessage('Заполните имя, ссылку и объём для каждой позиции.');return}
        const button=form.querySelector('button[type="submit"]');button.disabled=true;button.textContent='Отправляю…';message.className='message';
        const payload=positions.map(item=>({client_name:clientName,contact:'Не указан',fragrance:'Заказ по ссылке',fragrance_url:item.url,note:item.volume+' мл',status:'Новая',source:'client'}));
        const {error}=await cloud.from('as_parfums_requests').insert(payload);
        button.disabled=false;button.textContent='Отправить заказ';
        if(error){showMessage('Не получилось отправить заказ. Попробуйте ещё раз чуть позже.');return}
        document.getElementById('successText').textContent='В корзину добавлено позиций: '+positions.length+'.';
        form.reset();items.innerHTML='';addItem();form.style.display='none';success.classList.add('show');
      });
      document.getElementById('sendAgain').addEventListener('click',()=>{success.classList.remove('show');form.style.display='block';message.className='message';document.getElementById('clientName').focus()});
      addItem();
    })();
  </script>
</body>
</html>
