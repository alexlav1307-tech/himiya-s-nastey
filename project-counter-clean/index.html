<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6f625b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Проекты"><title>Счётчик проектов</title><style>:root{--bg:#f3f1ee;--card:#fff;--accent:#6f625b;--line:#ded6d1;--text:#3f3733;--muted:#8a7c74}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);padding:14px 14px calc(24px + env(safe-area-inset-bottom))}.wrap{max-width:860px;margin:auto}h1{text-align:center;font-size:26px;margin:14px 0 6px}.sub{color:var(--muted);font-size:13px;text-align:center;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 4px 16px #0000000c}.title{font-size:18px;font-weight:800;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}input,select,button{width:100%;font:inherit;border-radius:12px;border:1px solid var(--line);padding:12px;background:#fff;color:var(--text)}button{background:var(--accent);color:#fff;border:0;font-weight:700}.secondary{background:#ece6e2;color:var(--text)}.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}.stat{background:#f1ece8;border-radius:14px;padding:12px;text-align:center}.stat .label{font-size:12px;color:var(--muted)}.stat .num{font-size:24px;font-weight:800;margin-top:3px}.projects{display:flex;flex-direction:column;gap:10px}.project{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff}.project-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}.project-head b{font-size:17px}.mini{font-size:12px;color:var(--muted)}.pill{display:inline-block;border-radius:999px;padding:5px 8px;font-size:12px;background:#efe7e2}.status-working{background:#f1e5c9}.status-done{background:#dcebdc}.status-payment{background:#eadbea}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.result{background:#f8f4f1;border-radius:12px;padding:10px;text-align:center}.result b{display:block;font-size:17px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.assembly-preview{margin-top:10px;padding:10px;border-radius:12px;background:#f8f4f1;font-size:13px}@media(max-width:620px){.grid,.grid3,.results{grid-template-columns:1fr 1fr}.results .result:last-child{grid-column:1/-1}}</style></head><body><div class="wrap"><h1>Счётчик проектов</h1><div class="sub">Стоимость, предоплата, сборка, расходы, налог и чистая прибыль</div><div class="card"><div class="grid3"><div class="stat"><div class="label">Проектов</div><div class="num" id="count">0</div></div><div class="stat"><div class="label">Общая стоимость</div><div class="num" id="sumTotal">0 ₽</div></div><div class="stat"><div class="label">Чистая прибыль</div><div class="num" id="sumProfit">0 ₽</div></div></div></div><div class="card"><div class="title">Новый проект</div><div class="grid"><div><label>Название проекта</label><input id="name" placeholder="Например, квартира APAA"></div><div><label>Статус</label><select id="status"><option>В работе</option><option>Выполнено</option><option>Ожидает оплаты</option></select></div><div><label>Квадратура проекта, м²</label><input id="area" type="number" step="0.1" placeholder="80"></div><div><label>Стоимость за м², ₽</label><input id="rate" type="number" step="1" value="1500"></div><div><label>Предоплата, %</label><input id="prepayPct" type="number" step="1" value="50"></div><div><label>Налог, %</label><input id="taxPct" type="number" step="0.1" value="6"></div><div><label>Квадратура сборки, м²</label><input id="assemblyArea" type="number" step="0.1" placeholder="80"></div><div><label>Цена сборки за м², ₽</label><input id="assemblyRate" type="number" step="1" placeholder="300"></div><div><label>Прочие доп. расходы, ₽</label><input id="expenses" type="number" step="1" value="0"></div><div><label>Итого сборка</label><input id="assemblyTotalPreview" value="0 ₽" readonly></div></div><div class="assembly-preview">Сборка: квадратура сборки × цена за м². Итог автоматически вычитается из чистой прибыли.</div><div style="margin-top:12px"><button id="add">Добавить проект</button></div></div><div class="card"><div class="title">Мои проекты</div><div id="projects" class="projects"></div></div><div class="sub">Все данные сохраняются только на этом устройстве.</div></div><script>let projects=JSON.parse(localStorage.getItem('project_counter_clean_v1')||localStorage.getItem('project_counter_v2')||localStorage.getItem('project_counter_v1')||'[]');const $=s=>document.querySelector(s);const money=n=>Math.round(n||0).toLocaleString('ru-RU')+' ₽';function calc(p){const total=(+p.area||0)*(+p.rate||0);const prepay=total*(+p.prepayPct||0)/100;const remain=total-prepay;const assembly=(+p.assemblyArea||0)*(+p.assemblyRate||0);const tax=total*(+p.taxPct||0)/100;const profit=total-assembly-(+p.expenses||0)-tax;return{total,prepay,remain,assembly,tax,profit}}function save(){localStorage.setItem('project_counter_clean_v1',JSON.stringify(projects))}function statusClass(s){return s==='Выполнено'?'status-done':s==='Ожидает оплаты'?'status-payment':'status-working'}function updateAssemblyPreview(){const area=parseFloat($('#assemblyArea').value)||0;const rate=parseFloat($('#assemblyRate').value)||0;$('#assemblyTotalPreview').value=money(area*rate)}function render(){const box=$('#projects');box.innerHTML='';let st=0,sp=0;projects.forEach((p,i)=>{const c=calc(p);st+=c.total;sp+=c.profit;const d=document.createElement('div');d.className='project';d.innerHTML=`<div class="project-head"><div><b>${p.name||'Без названия'}</b><br><span class="mini">${p.area||0} м² × ${money(p.rate).replace(' ₽','')} ₽/м²</span></div><div style="text-align:right"><span class="pill ${statusClass(p.status||'В работе')}">${p.status||'В работе'}</span><br><span class="pill" style="margin-top:5px">${p.prepayPct||0}% предоплата</span></div></div><div class="results"><div class="result"><span class="mini">Стоимость</span><b>${money(c.total)}</b></div><div class="result"><span class="mini">Предоплата</span><b>${money(c.prepay)}</b></div><div class="result"><span class="mini">Остаток</span><b>${money(c.remain)}</b></div><div class="result"><span class="mini">Сборка</span><b>${money(c.assembly)}</b><span class="mini">${p.assemblyArea||0} м² × ${p.assemblyRate||0} ₽</span></div><div class="result"><span class="mini">Прочие расходы</span><b>${money(p.expenses)}</b></div><div class="result"><span class="mini">Налог</span><b>${money(c.tax)}</b></div><div class="result"><span class="mini">Чистая прибыль</span><b>${money(c.profit)}</b></div></div><div class="actions"><button class="secondary" data-edit="${i}">Изменить</button><button class="ghost" data-del="${i}">Удалить</button></div>`;box.appendChild(d)});$('#count').textContent=projects.length;$('#sumTotal').textContent=money(st);$('#sumProfit').textContent=money(sp);box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Удалить проект?')){projects.splice(+b.dataset.del,1);save();render()}});box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const i=+b.dataset.edit,p=projects[i];$('#name').value=p.name||'';$('#status').value=p.status||'В работе';$('#area').value=p.area||'';$('#rate').value=p.rate||1500;$('#prepayPct').value=p.prepayPct||50;$('#taxPct').value=p.taxPct||6;$('#assemblyArea').value=p.assemblyArea||'';$('#assemblyRate').value=p.assemblyRate||'';$('#expenses').value=p.expenses||0;projects.splice(i,1);save();render();updateAssemblyPreview();scrollTo({top:0,behavior:'smooth'})})}['input','change','keyup','blur'].forEach(evt=>{$('#assemblyArea').addEventListener(evt,updateAssemblyPreview);$('#assemblyRate').addEventListener(evt,updateAssemblyPreview)});setTimeout(updateAssemblyPreview,200);setTimeout(updateAssemblyPreview,800);setInterval(updateAssemblyPreview,1000);$('#add').onclick=()=>{updateAssemblyPreview();const p={name:$('#name').value.trim(),status:$('#status').value,area:+$('#area').value,rate:+$('#rate').value,prepayPct:+$('#prepayPct').value,taxPct:+$('#taxPct').value,assemblyArea:+$('#assemblyArea').value,assemblyRate:+$('#assemblyRate').value,expenses:+$('#expenses').value};if(!p.name||!p.area||!p.rate)return alert('Заполни название, квадратуру и стоимость за м²');projects.unshift(p);save();render();$('#name').value='';$('#status').value='В работе';$('#area').value='';$('#assemblyArea').value='';$('#assemblyRate').value='';$('#expenses').value=0;updateAssemblyPreview()};updateAssemblyPreview();render();</script></body></html>
